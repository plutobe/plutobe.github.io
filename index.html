<!DOCTYPE html>
<html lang="zh-CN">
<head><title>z.</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2">
    <meta name="theme-color" content="#222325">
    <link rel="stylesheet" href="css/font.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="prefetch" href="https://cdn.jsdelivr.net/">
    <meta name="description" content="Author:z.,Category:Personal HomePage">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
<main>
    <div class="content content-intro">
        <div class="content-inner">
            <canvas id="background"></canvas>
            <div class="wrap fade">
                <h2 class="content-title">z.</h2>
                <h3 class="content-subtitle" original-content="Front back left right end engineer">&nbsp;</h3><a
                        class="enter">enter</a>
                <div class="arrow arrow-1"></div>
                <div class="arrow arrow-2"></div>
            </div>
        </div>
        <div class="shape-wrap">
            <svg class="shape" width="100%" height="100vh" preserveAspectRatio="none" viewBox="0 0 1440 800"
                 xmlns:pathdata="http://www.codrops.com/">
                <path d="M -44,-50 C -52.71,28.52 15.86,8.186 184,14.69 383.3,22.39 462.5,12.58 638,14 835.5,15.6 987,6.4 1194,13.86 1661,30.68 1652,-36.74 1582,-140.1 1512,-243.5 15.88,-589.5 -44,-50 Z"
                      pathdata:id="M -44,-50 C -137.1,117.4 67.86,445.5 236,452 435.3,459.7 500.5,242.6 676,244 873.5,245.6 957,522.4 1154,594 1593,753.7 1793,226.3 1582,-126 1371,-478.3 219.8,-524.2 -44,-50 Z"></path>
            </svg>
        </div>
    </div>
    <div class="content content-main">
        <div id="card">
            <div class="card-inner fade">
                <header><img src="assets/avatar.jpg" width="100" height="100" alt="avatar">
                    <h1 data-translate="name">z.</h1>
                    <h2 id="signature" data-translate="signature">Code &amp; Input &amp; Output</h2></header>
                <ul>
                    <li>
                        <a href="javascript:void(0)" aria-label="WeChat" id="wechat-link"><i class="icon icon-wechat"></i><span data-translate="WeChat">WeChat</span></a>
                    </li>
                    <li>
                        <a href="https://github.com/plutobe" aria-label="Github" target="_blank"><i class="icon icon-github"></i><span data-translate="Github">Github</span></a>
                    </li>
                    <li>
                        <a href="https://twitter.com/plutobez" aria-label="Twitter" target="_blank"><i class="icon icon-twitter"></i><span data-translate="Twitter">Twitter</span></a>
                    </li>
                    <li>
                        <a href="mailto:plutobe@qq.com" aria-label="Email" target="_blank"><i class="icon icon-email"></i><span data-translate="Email">Email</span></a>
                    </li>
                </ul>
            </div>
        </div>
        <canvas class="grid-background" id="gridCanvas"></canvas>
    </div>
    <div id="wechat-lightbox" class="lightbox">
        <img src="assets/wechat.jpg" alt="WeChat QR Code">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script>window.$ = selector => document.querySelector(selector)
    const getOriginalContent = selector => $(selector).getAttribute("original-content")
    window.subtitle = getOriginalContent(".content-subtitle")
    window.signature = getOriginalContent("#signature")
    window.config = {
        SIM_RESOLUTION: 128,
        DYE_RESOLUTION: 1024,
        CAPTURE_RESOLUTION: 512,
        DENSITY_DISSIPATION: 1,
        VELOCITY_DISSIPATION: 0.2,
        PRESSURE: 0.8,
        PRESSURE_ITERATIONS: 20,
        CURL: 30,
        SPLAT_RADIUS: 0.25,
        SPLAT_FORCE: 6000,
        SHADING: true,
        COLORFUL: true,
        COLOR_UPDATE_SPEED: 10,
        PAUSED: false,
        BACK_COLOR: {r: 30, g: 31, b: 33},
        TRANSPARENT: false,
        BLOOM: true,
        BLOOM_ITERATIONS: 8,
        BLOOM_RESOLUTION: 256,
        BLOOM_INTENSITY: 0.4,
        BLOOM_THRESHOLD: 0.8,
        BLOOM_SOFT_KNEE: 0.7,
        SUNRAYS: true,
        SUNRAYS_RESOLUTION: 196,
        SUNRAYS_WEIGHT: 1.0,
    }
    // WeChat lightbox
    const wechatLink = document.getElementById('wechat-link')
    const lightbox = document.getElementById('wechat-lightbox')
    wechatLink.addEventListener('click', (e) => {
        e.preventDefault()
        lightbox.classList.add('active')
    })
    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('active')
    })
    </script>
    <script src="js/main.js"></script>
    <script src="js/background.js"></script>
    <script src="js/log.min.js"></script>
</main>
</body>
</html>
